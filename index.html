<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nom Nom Planner - Weekly</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗓</text></svg>"/>
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <style>
      :root {
        --accent-color: cornflowerblue;
        accent-color: var(--accent-color);
      }
      
      html, body {
        padding: 0;
        margin: 0;
        width: 100%;
        height: 100vh;
        font-size: 14px;
      }
      
      * {
        font-family: sans-serif;
        accent-color: var(--accent-color);
      }

      body {
        width: calc(100% - 40px);
        margin: 20px;
        overflow-x: hidden;
        overflow-y: scroll;
        background-color: white;
        color: black;
      }
      
      button {
        border: 2px groove black;
        background-color: goldenrod;
        padding: 5px;
      }
      
      button:disabled {
        filter: brightness(0.75);
      }
      
      button:not(:disabled):hover {
        filter: brightness(1.25);
      }
      
      button:not(:disabled):active {
        border-color: white;
      }
      
      #header {
        font-weight: bold;
        display: grid;
        grid-template-columns: auto auto;
      }
      
      #main {
        width: 100%;
        height: 100%;
      }
      
      .dayHeader {
        font-size: 18px;
        font-weight: bold;
        text-shadow: 0 0 5px var(--accent-color);
        border-bottom: 3px var(--accent-color) dotted;
        text-align: center;
      }
      
      .dayCell input, .dayCell table {
        width: 100%;
      }
    </style>
    
    <style>
      @media print {
        @page {
          size: 8.5in 11in;
        }
        
        body {
          width: 100%;
          margin: 0;
        }
        
        input {
          border: 0;
          background-color: white;
        }
        
        *::placeholder {
          opacity: 0;
        }
        
        .hideOnPrint {
          display: none !important;
        }
      }
    </style>
  </head>
  <body x-data="state">
    <!--
      DEBUG for our `meals` state
      <div>
        <textarea x-text="JSON.stringify(meals, null, 2)" rows="30" cols="50"></textarea>
      </div>
    -->
    
    <div id="header" class="hideOnPrint">
      <div style="text-align: left;">
        <span x-text="`Today is ${new Date().toLocaleDateString(DATE_LOCALE, DATE_OPTIONS)}`"></span>
        &nbsp;|&nbsp;
        <button @click="clearMeals()">Clear Meals</button>
      </div>
      <div style="text-align: right;">
        <input x-model="newPerson" placeholder="Name of a new person to add" @keyup.enter="addNewPerson()"></input>
        <button @click="addNewPerson()" :disabled="!newPerson?.trim()?.length">Add</button>
        &nbsp;|&nbsp;
        <template x-for="person in people">
          <button @click="removePerson(person)" x-text="`❌ ${person}`"></button>
        </template>
      </div>
    </div>
    
    <table id="main">
      <template x-for="day in DAYS">
        <tr>
          <td class="dayCell">
            <div class="dayHeader" x-text="headerForDay(day)"></div>
            <table class="w100">
              <tr>
                <td>🌅 Breakfast</td>
                <td><input x-model="meals[day].breakfast"></input></td>
              </tr>
              <template x-for="person in people">
                <tr>
                  <td x-text="`🏙 Lunch - ${person}`"></td>
                  <td>
                    <input :placeholder="`Enter lunch for ${person}`" x-model="meals[day].lunch[person]"></input>
                  </td>
                </tr>
              </template>
              <tr>
                <td>🌃 Dinner</td>
                <td><input x-model="meals[day].dinner"></input></td>
              </tr>
            </table>
          </td>
        </tr>
      </template>
    </table>
    
    <script>
      const LS_PEOPLE = "people";
      const LS_MEALS = "meals";
      const DATE_LOCALE = "en-CA";
      const DATE_OPTIONS = options = { month: 'short', day: 'numeric' };
      const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    
      document.addEventListener("alpine:init", () => {
        Alpine.data("state", () => ({
          people: ["All"],
          meals: {},
          newPerson: null,
          
          init() {
            this.meals = this.getDefaultMeals();
            
            this.loadLocalStorage();
            this.$watch("meals", () => this.saveLocalStorage());
            this.$watch("people", () => this.saveLocalStorage());
          },
          
          getDefaultMeals() {
            return Object.fromEntries(DAYS.map(day => [day, {
              "breakfast": null,
              "dinner": null,
              "lunch": Object.fromEntries(this.people.map(person => [person, null])),
            }]));
          },
          
          addNewPerson() {
            this.people.push(this.newPerson);
            this.people.sort();
            
            this.newPerson = null;
          },
          
          removePerson(toRemove) {
            const foundAt = this.people.findIndex(person => person === toRemove);
            if (foundAt !== -1) {
              this.people.splice(foundAt, 1);
            }
          },
          
          clearMeals() {
            localStorage.removeItem(LS_MEALS);
          },
          
          headerForDay(day) {
            // Find our next Monday, so we're always looking a week ahead
            const today = new Date();
            const monday = new Date(today);
            const daysUntilMonday = (8 - today.getDay()) % 7 || 7;
            monday.setDate(today.getDate() + daysUntilMonday);
            
            const date = new Date(monday);
            date.setDate(monday.getDate() + DAYS.indexOf(day));

            return day + " " + date.toLocaleDateString(DATE_LOCALE, DATE_OPTIONS);
          },
          
          loadLocalStorage() {
            this._genericLoadLocalStorage(LS_PEOPLE, "people");
            this._genericLoadLocalStorage(LS_MEALS, "meals");
          },
          
          _genericLoadLocalStorage(key, setTo) {
            const found = localStorage.getItem(key);
            if (found) {
              try {
                this[setTo] = JSON.parse(found);
              } catch (err) {
                console.error("Failed to load local storage item [" + key + "]");
              }
            }
          },
          
          saveLocalStorage() {
            localStorage.setItem(LS_MEALS, JSON.stringify(this.meals));
            localStorage.setItem(LS_PEOPLE, JSON.stringify(this.people));
          }
        }));
      });
    </script>
  </body>
</html>
