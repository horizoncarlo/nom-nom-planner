<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nom Nom Planner - Weekly</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗓</text></svg>"/>
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <style>
      :root {
        --accent-color: cornflowerblue;
        accent-color: var(--accent-color);
      }
      
      html, body {
        padding: 0;
        margin: 0;
        width: 100%;
        height: 100vh;
        font-size: 14px;
      }
      
      * {
        font-family: sans-serif;
        accent-color: var(--accent-color);
      }

      body {
        max-width: 1024px;
        width: calc(100% - 40px);
        padding: 20px;
        margin-left: auto;
        margin-right: auto;
        overflow-x: hidden;
        overflow-y: scroll;
        color: white;
        background: #091123;
        background: linear-gradient(0deg,var(--accent-color) 1%, #132145 20%, #091123 50%);
        background-repeat: no-repeat;
        background-attachment: fixed;
      }
      
      button {
        border: 2px groove black;
        background-color: goldenrod;
        padding: 5px;
      }
      
      button:disabled {
        filter: brightness(0.75);
      }
      
      button:not(:disabled):hover {
        filter: brightness(1.25);
      }
      
      button:not(:disabled):active {
        border-color: white;
      }
      
      textarea {
        resize: none;
        color: white;
        background-color: transparent;
      }
      
      #goofyGif {
        cursor: not-allowed;
        position: fixed;
        top: 10px;
        left: 10px;
        padding: 0;
        margin: 0;
        border-radius: 10px;
        box-shadow: 0 0 30px var(--accent-color);
        outline: 5px inset var(--accent-color);
      }
      
      #goofyGif img {
        display: block;
        max-width: 250px;
      }
      
      #header {
        display: grid;
        grid-template-columns: auto auto;
        margin-bottom: 20px;
      }
      
      #main {
        width: 100%;
        height: 100%;
      }
      
      .dayHeader, legend {
        font-weight: bold;
        font-size: 18px;
        text-align: center;
        text-shadow: 0 0 5px var(--accent-color);
      }
      
      .dayHeader {
        border-bottom: 3px var(--accent-color) dotted;
      }
      
      .dayCell input, .dayCell table {
        width: 100%;
      }
    </style>
    
    <style>
      @media print {
        @page {
          size: 8.5in 11in;
        }
        
        body {
          width: 100%;
          padding: 0;
          margin: 0;
          background-color: white;
          color: black;
        }
        
        input, textarea {
          border: 0;
          color: black;
          background-color: white;
          resize: none;
        }
        
        *::placeholder {
          opacity: 0;
        }
        
        .hideOnPrint {
          display: none !important;
        }
      }
    </style>
  </head>
  <body x-data="state">
    <!--
      DEBUG for our `meals` state
      <div>
        <textarea x-text="JSON.stringify(meals, null, 2)" rows="30" cols="50"></textarea>
      </div>
    -->
    
    <div id="goofyGif" class="hideOnPrint" @click="$el.style.display = 'none';">
      <img :src="gifChoice" draggable="false" onerror="this.style.display='none';"></img>
    </div>
    
    <fieldset id="header" class="hideOnPrint">
      <legend>Setup <small>(hidden on Print)</small></legend>
      <div style="text-align: left;">
        <b x-text="`Today is ${new Date().toLocaleDateString(DATE_LOCALE, { month: 'long', day: 'numeric' })}`"></b>
        &nbsp;|&nbsp;
        <button @click="clearMeals()">Clear Meals</button>
      </div>
      <div style="text-align: right;">
        <input x-model="newPerson" placeholder="Name of a new person to add" @keyup.enter="addNewPerson()"></input>
        <button @click="addNewPerson()" :disabled="!newPerson?.trim()?.length">Add</button>
        &nbsp;|&nbsp;
        <template x-for="person in people">
          <button @click="removePerson(person)" x-text="`❌ ${person}`"></button>
        </template>
      </div>
    </fieldset>
    
    <table id="main">
      <template x-for="(day, index) in DAYS">
        <tr>
          <td class="dayCell">
            <div class="dayHeader" x-text="headerForDay(day)" :style="index >= 5 ? 'border-bottom-style: solid;' : ''"></div>
            <table class="w100">
              <tr>
                <td :rowspan="3 + people?.length">
                  <textarea :rows="3 + people?.length" style="width: 90%;" x-model="meals[day].notes"
                            :placeholder="index === 0 ? 'Notes for the day, such as things to thaw, ingredients to buy, etc.' : null"></textarea>
                </td>
              </tr>
              <tr>
                <td>🌅 Breakfast</td>
                <td><input x-model="meals[day].breakfast"></input></td>
              </tr>
              <template x-for="person in people">
                <tr>
                  <td x-text="`🏙 Lunch - ${person}`"></td>
                  <td>
                    <input :placeholder="`Enter lunch for ${person}`" x-model="meals[day].lunch[person]"></input>
                  </td>
                </tr>
              </template>
              <tr>
                <td>🌃 Dinner</td>
                <td><input x-model="meals[day].dinner"></input></td>
              </tr>
            </table>
          </td>
        </tr>
      </template>
    </table>
    
    <script>
      const LS_PEOPLE = "people";
      const LS_MEALS = "meals";
      const DATE_LOCALE = "en-CA";
      const DATE_OPTIONS = options = { month: 'short', day: 'numeric' };
      const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
      const GIFS = [
        "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExYWo4N21kOWpkcHFlY2MyNGZxY2RjeTVzMnI1YjBzdHJtNnB0bGExdCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/10xnAw9YM8IYLe/giphy.gif",
        "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExOXpmYzlhZ3Zlajl1Nzh3MHVtbmJoeTJlbXN1dmFzbXppaWcxM2FtbSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/I75I56Qz6TdqU/giphy.gif",
        "https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExNDg3c3Z4MmludDVldDZ5c3NraGp4eG8wcGp4d2lkbDV1M2o2Z2loMiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/5ev3alRsskWA0/giphy.gif",
        "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExZnR3ZnVtajJueWljNHU3eTA0b3l6ZTRyZDJndHBoYjB5MW5mcTU0dSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/t7AI4TmE0PYI/giphy.gif",
        "https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExY3g4M3B4NXowMXR2MnY0cDk0MmhkcW1jM2RzNnl4YzNodmgzNXR4aiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/KpeafwpslVACDwchH1/giphy.gif",
        "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExcGR0ajkwem9pZTcyOHM3NHJzYXc5amVsbGR4MmJrdXlnYzd3b3NidCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/LfoZkIQqdUHmM/giphy.gif",
      ];
    
      document.addEventListener("alpine:init", () => {
        Alpine.data("state", () => ({
          people: ["All"],
          meals: {},
          newPerson: null,
          gifChoice: GIFS[Math.floor(Math.random() * GIFS.length)],
          
          init() {
            this.meals = this.getDefaultMeals();
            
            this.loadLocalStorage();
            this.$watch("meals", () => this.saveLocalStorage());
            this.$watch("people", () => this.saveLocalStorage());
          },
          
          getDefaultMeals() {
            return Object.fromEntries(DAYS.map(day => [day, {
              "notes": null,
              "breakfast": null,
              "dinner": null,
              "lunch": Object.fromEntries(this.people.map(person => [person, null])),
            }]));
          },
          
          addNewPerson() {
            this.people.push(this.newPerson);
            this.people.sort();
            
            this.newPerson = null;
          },
          
          removePerson(toRemove) {
            const foundAt = this.people.findIndex(person => person === toRemove);
            if (foundAt !== -1) {
              this.people.splice(foundAt, 1);
            }
          },
          
          clearMeals() {
            localStorage.removeItem(LS_MEALS);
            this.meals = this.getDefaultMeals();
          },
          
          headerForDay(day) {
            // Find our next Monday, so we're always looking a week ahead
            const today = new Date();
            const monday = new Date(today);
            const daysUntilMonday = (8 - today.getDay()) % 7 || 7;
            monday.setDate(today.getDate() + daysUntilMonday);
            
            const date = new Date(monday);
            date.setDate(monday.getDate() + DAYS.indexOf(day));

            return day + " (" + date.toLocaleDateString(DATE_LOCALE, DATE_OPTIONS) + ")";
          },
          
          loadLocalStorage() {
            this._genericLoadLocalStorage(LS_PEOPLE, "people");
            this._genericLoadLocalStorage(LS_MEALS, "meals");
          },
          
          _genericLoadLocalStorage(key, setTo) {
            const found = localStorage.getItem(key);
            if (found) {
              try {
                this[setTo] = JSON.parse(found);
              } catch (err) {
                console.error("Failed to load local storage item [" + key + "]");
              }
            }
          },
          
          saveLocalStorage() {
            localStorage.setItem(LS_MEALS, JSON.stringify(this.meals));
            localStorage.setItem(LS_PEOPLE, JSON.stringify(this.people));
          }
        }));
      });
    </script>
  </body>
</html>
